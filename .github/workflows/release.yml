name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner, not Ubuntu: the darwin build sets CGO_ENABLED=1 so
    # clipboard paste works (issue #156), and cgo for darwin needs the
    # Apple SDK at link time. Go on macOS still cross-compiles the
    # CGO_ENABLED=0 linux/windows targets, and nfpm runs fine there, so a
    # single job covers every artifact.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The release body is the CHANGELOG.md section for this tag. The step
      # fails when there is no section, so a release cannot ship without a
      # changelog entry. The file lives outside the checkout so it does not
      # dirty the tree goreleaser checks.
      - name: Extract release notes
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Uncomment after generating an AUR SSH key and adding it as a secret:
          # AUR_KEY: ${{ secrets.AUR_KEY }}
